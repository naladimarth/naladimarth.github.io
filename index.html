<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Naladimarth</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Naladimarth — Independent apps & utilities." />

  <style>
    :root {
      --bg: #0b0d10;
      --fg: #f1f2f6;
      --muted: #9aa0aa;
      --accent: #8b8bff;
      --glow: rgba(139,139,255,0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(
          1000px 600px at 40% -20%,
          rgba(139,139,255,0.18),
          transparent 60%
        ),
        var(--bg);
      color: var(--fg);
      overflow-x: hidden;
    }

    main {
      max-width: 980px;
      margin: auto;
      padding: 140px 24px 120px;
      position: relative;
    }

    /* BRAND */
    h1 {
      font-size: clamp(3.2rem, 7vw, 4.6rem);
      font-weight: 650;
      letter-spacing: -0.025em;
      margin: 0;
      text-shadow:
        0 0 18px var(--glow),
        0 0 48px rgba(139,139,255,0.25);
      animation: glowPulse 6s ease-in-out infinite;
    }

    h2 {
      margin-top: 14px;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--accent);
      opacity: 0.9;
    }

    p {
      margin-top: 28px;
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--muted);
      max-width: 560px;
    }

    nav {
      margin-top: 56px;
      display: flex;
      gap: 32px;
    }

    nav a {
      text-decoration: none;
      font-weight: 500;
      color: var(--fg);
      opacity: 0.85;
      position: relative;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    footer {
      margin-top: 160px;
      font-size: 0.85rem;
      color: #7b808a;
    }

    /* subtle divider */
    .divider {
      margin-top: 90px;
      width: 140px;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        var(--accent),
        transparent
      );
      opacity: 0.6;
    }

    /* ambient glow animation */
    @keyframes glowPulse {
      0% {
        text-shadow:
          0 0 18px var(--glow),
          0 0 48px rgba(139,139,255,0.25);
      }
      50% {
        text-shadow:
          0 0 26px rgba(139,139,255,0.7),
          0 0 70px rgba(139,139,255,0.4);
      }
      100% {
        text-shadow:
          0 0 18px var(--glow),
          0 0 48px rgba(139,139,255,0.25);
      }
    }

    /* beaver placeholder layer */
    .beaver {
      position: absolute;
      right: -120px;
      top: 80px;
      width: 420px;
      height: 420px;
      background: radial-gradient(
        circle at center,
        rgba(139,139,255,0.12),
        transparent 70%
      );
      opacity: 0.35;
      filter: blur(2px);
      pointer-events: none;
      animation: float 18s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(24px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>

<body>
  <main>
  <img class="beaver" src="/beaver.svg" alt="" />


    <h1>Naladimarth</h1>
    <h2>crafted with intent</h2>

    <p>
      Independent apps & utilities focused on simplicity,
      performance, and long-term value.
    </p>

    <nav>
      <a href="/privacy-policy.html">Privacy</a>
      <a href="/terms.html">Terms</a>
    </nav>

    <div class="divider"></div>

    <footer>
      © 2026 Naladimarth
    </footer>
  </main>
</body>
</html>
