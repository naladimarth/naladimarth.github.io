<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b8bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b8bff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- engineered beaver abstraction -->
  <g fill="none" stroke="url(#lineGlow)" stroke-width="6" opacity="0.35">

    <!-- body (structured oval) -->
    <path d="M180 320
             C180 250, 420 250, 420 320
             C420 390, 180 390, 180 320 Z"/>

    <!-- head block -->
    <path d="M240 250
             C240 210, 360 210, 360 250"/>

    <!-- tail (flat, architectural) -->
    <path d="M300 390
             C270 440, 330 470, 300 520"/>

    <!-- construction lines -->
    <line x1="300" y1="240" x2="300" y2="390" opacity="0.25"/>
    <line x1="220" y1="320" x2="380" y2="320" opacity="0.25"/>

  </g>
</svg>
